  <main class="wrap">
    <section class="hero">
      <h1>Markdown 转纯文本</h1>
      <p class="lede">笔记里常用列表和加粗，交周报的系统却只接受纯文本。这里去掉标记，列表改成编号。</p>
    </section>
    <section class="grid-2">
      <div class="card">
        <label for="md-in">Markdown</label>
        <textarea id="md-in" class="mono" style="min-height:260px;" placeholder="## 本周完成&#10;- 事项一"></textarea>
        <div class="btn-row">
          <button type="button" id="btn-md-convert">转成纯文本</button>
          <button type="button" class="secondary" id="btn-md-sample">示例</button>
          <button type="button" class="ghost" id="btn-md-copy">复制</button>
        </div>
      </div>
      <div class="card">
        <h2>纯文本</h2>
        <div id="md-out" class="preview"></div>
      </div>
    </section>
  </main>
